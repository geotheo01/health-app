{% extends 'base.html' %}
{% block page_title %}<h3>{{ _('Edit Food') if food else _('Add New Food') }}</h3>{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2><i data-lucide="{{ 'edit-3' if food else 'plus-circle' }}"></i> {{ _('Food Data') }}</h2>
        <a href="{{ url_for('admin.foods_list') }}" class="btn btn-secondary">
            <i data-lucide="arrow-left"></i>
            {{ _('Back') }}
        </a>
    </div>

    <form method="POST" action="{{ url_for('admin.edit_food', key=food_key) if food else url_for('admin.add_food') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-group">
            <label for="key">{{ _('System Key (Matches AI Output)') }}</label>
            <input type="text" id="key" name="key" class="form-control" value="{{ food_key }}" required placeholder="e.g. apple, fried_chicken">
            <small style="color: var(--slate); margin-top: 6px; display: block;">
                {{ _('This must exactly match the AI output label for the recognition to work.') }}
            </small>
        </div>
        
        <div class="form-group">
            <label for="friendly_name">{{ _('Friendly Name (Display Name)') }}</label>
            <input type="text" id="friendly_name" name="friendly_name" class="form-control" value="{{ food.friendly_name if food else '' }}" required placeholder="e.g. Fresh Apple">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="calories">{{ _('Calories (kcal)') }}</label>
                <input type="number" step="0.1" id="calories" name="calories" class="form-control" value="{{ food.calories if food else '' }}" required>
            </div>
            <div class="form-group">
                <label for="protein">{{ _('Protein (g)') }}</label>
                <input type="number" step="0.1" id="protein" name="protein" class="form-control" value="{{ food.protein if food else '' }}" required>
            </div>
            <div class="form-group">
                <label for="carbs">{{ _('Carbohydrates (g)') }}</label>
                <input type="number" step="0.1" id="carbs" name="carbs" class="form-control" value="{{ food.carbs if food else '' }}" required>
            </div>
            <div class="form-group">
                <label for="fat">{{ _('Fat (g)') }}</label>
                <input type="number" step="0.1" id="fat" name="fat" class="form-control" value="{{ food.fat if food else '' }}" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 16px;">
            <i data-lucide="save"></i>
            {{ _('Save Food') }}
        </button>
    </form>
</div>
{% endblock %}
