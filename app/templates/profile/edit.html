{% extends 'base.html' %}
{% block page_title %}<h3>{{ _('Edit Profile') }}</h3>{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
        <h2 style="margin: 0; display: flex; align-items: center; gap: 12px;">
            <i data-lucide="user-cog" style="color: var(--teal);"></i>
            {{ _('Update Profile') }}
        </h2>
        <p style="color: var(--slate); margin-top: 8px;">{{ _('Help us personalize your health insights by providing your details.') }}</p>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px;">
            <div style="display: flex; flex-direction: column; gap: 24px;">
                <div class="form-group">
                    <label><i data-lucide="calendar"></i> {{ _('Age') }}</label>
                    <input type="number" name="age" min="10" max="120" value="{{ profile.age if profile else '' }}" placeholder="{{ _('years') }}">
                </div>
                <div class="form-group">
                    <label><i data-lucide="users"></i> {{ _('Gender') }}</label>
                    <select name="gender">
                        <option value="">{{ _('Select...') }}</option>
                        <option value="Male" {{ 'selected' if profile and profile.gender == 'Male' else '' }}>{{ _('Male') }}</option>
                        <option value="Female" {{ 'selected' if profile and profile.gender == 'Female' else '' }}>{{ _('Female') }}</option>
                        <option value="Other" {{ 'selected' if profile and profile.gender == 'Other' else '' }}>{{ _('Other') }}</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 24px;">
                <div class="form-group">
                    <label><i data-lucide="ruler"></i> {{ _('Height') }} (cm)</label>
                    <input type="number" step="0.1" min="120" max="230" name="height_cm" value="{{ profile.height_cm if profile else '' }}" placeholder="cm">
                </div>
                <div class="form-group">
                    <label><i data-lucide="scale"></i> {{ _('Weight') }} (kg)</label>
                    <input type="number" step="0.1" min="40" max="230" name="weight_kg" value="{{ profile.weight_kg if profile else '' }}" placeholder="kg">
                </div>
            </div>
        </div>

        <div class="form-group" style="margin-top: 32px;">
            <label><i data-lucide="activity"></i> {{ _('Activity Level') }}</label>
            <select name="activity_level">
                <option value="">{{ _('Select Activity Level...') }}</option>
                <option value="Sedentary" {{ 'selected' if profile and profile.activity_level == 'Sedentary' else '' }}>{{ _('Sedentary (Little or no exercise)') }}</option>
                <option value="Lightly Active" {{ 'selected' if profile and profile.activity_level == 'Lightly Active' else '' }}>{{ _('Lightly Active (1-3 days/week)') }}</option>
                <option value="Moderately Active" {{ 'selected' if profile and profile.activity_level == 'Moderately Active' else '' }}>{{ _('Moderately Active (3-5 days/week)') }}</option>
                <option value="Very Active" {{ 'selected' if profile and profile.activity_level == 'Very Active' else '' }}>{{ _('Very Active (6-7 days/week)') }}</option>
            </select>
        </div>

        <div class="form-group" style="margin-top: 24px;">
            <label><i data-lucide="target"></i> {{ _('Main Health Goal') }}</label>
            <input type="text" name="health_goal" value="{{ profile.health_goal if profile else '' }}" placeholder="{{ _('e.g., Weight loss, Muscle gain, Maintenance') }}">
        </div>

        <div style="display: flex; gap: 16px; border-top: 1px solid var(--border); padding-top: 32px; margin-top: 32px;">
            <button type="submit" class="btn" style="padding: 12px 32px; font-size: 1rem;">
                <i data-lucide="save"></i> {{ _('Update Profile') }}
            </button>
            <a href="{{ url_for('profile.view') }}" class="btn btn-secondary" style="padding: 12px 32px; font-size: 1rem;">
                {{ _('Cancel') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
