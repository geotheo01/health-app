{% extends 'base.html' %}

{% block auth_content %}
<div class="center-wrapper">
    <div class="card auth-card text-center" style="padding: 48px;">
        <div class="icon-circle icon-teal" style="margin: 0 auto 24px; width: 64px; height: 64px;">
            <i data-lucide="activity" style="width: 32px; height: 32px;"></i>
        </div>
        <h1 style="margin: 0; font-size: 2.25rem; font-weight: 800; color: var(--navy);">{{ _('Welcome to Smart Health Tracker') }}</h1>
        <p style="margin: 16px 0 32px 0; color: var(--slate); font-size: 1.1rem; line-height: 1.6;">
            {{ _('Your personal companion for tracking nutrition, hydration, and wellness. Start your journey to a healthier lifestyle today.') }}
        </p>
        <div style="display: flex; gap: 16px; justify-content: center;">
            <a href="{{ url_for('auth.login') }}" class="btn" style="padding: 12px 32px;">{{ _('Login') }}</a>
            <a href="{{ url_for('auth.register') }}" class="btn btn-secondary" style="padding: 12px 32px;">{{ _('Join Now') }}</a>
        </div>
    </div>
</div>
{% endblock %}
